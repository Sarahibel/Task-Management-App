<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Task Manager</h1>

    <!-- 1. Add a new task -->
    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a task</h2>

      <form id="task-form" novalidate>
        <div class="field field-wide">
          <label for="task-name">Task name</label>
          <input type="text" id="task-name" placeholder="Finish JavaScript assignment">
        </div>

        <div class="field">
          <label for="task-category">Category</label>
          <select id="task-category">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="task-deadline">Deadline</label>
          <input type="date" id="task-deadline">
        </div>

        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status">
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Add Task</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <!-- 2. Filters -->
    <section class="panel filters" aria-labelledby="filter-heading">
      <h2 id="filter-heading">Filter tasks</h2>

      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="All">All statuses</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Overdue">Overdue</option>
        </select>
      </div>

      <div class="field">
        <label for="filter-category">Category</label>
        <select id="filter-category">
          <option value="All">All categories</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Study">Study</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button type="button" id="clear-filters">Clear filters</button>
    </section>

    <!-- 3. Task list -->
    <section aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">Your tasks</h2>
        <span id="task-count" class="count"></span>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty" hidden></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
